name: Create project backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-backup.yml'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create zip
        run: zip -r gmesteticav13-current.zip . -x '.git/*'
      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: gmesteticav13-current
          path: gmesteticav13-current.zip
